services:
  - type: web
    name: the-network
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PRODUCTION
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: BACKEND_PORT
        value: "8081"
      - key: DATA_DIR
        value: /var/data
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        value: 5rjchzz6j9@privaterelay.appleid.com,mitchellwhite018@gmail.com
      - key: OWNER_NAME
        value: Mitchell White
      - key: SMTP_HOST
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_SSL
        value: "0"
    disk:
      name: network-data
      mountPath: /var/data
      sizeGB: 1
